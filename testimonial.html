<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Testimonials | Rannaghor</title>
 
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
 
  <!-- শুধু এই আলাদা ফাইলে চালানোর জন্য Tailwind v4 browser build।
       আপনার আসল প্রজেক্টে এই script আর নিচের <style type="text/tailwindcss"> বাদ দিয়ে output.css ব্যবহার করুন -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.8"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-primary: #1b1a17;
      --color-primary-light: #2a2824;
      --color-secondary: #c4532d;
      --color-secondary-dark: #a8431f;
      --color-paper: #faf6ee;
      --color-concrete: #f0e9dc;
      --font-sans: "Plus Jakarta Sans", sans-serif;
    }
    @layer base {
      h1, h2, h3 { letter-spacing: -0.02em; }
    }
  </style>
</head>
 
<body class="bg-paper font-sans text-primary antialiased">
 
  <!-- Testimonials -->
  <section class="px-3 py-6 sm:px-4" aria-labelledby="t-heading">
    <div class="mx-auto max-w-7xl overflow-hidden rounded-[2.5rem] bg-primary px-6 py-20 text-paper sm:px-12 lg:px-20 lg:py-28">
      <div class="grid items-center gap-16 lg:grid-cols-2">
 
        <!-- লেখা + বাটন -->
        <div>
          <h2 id="t-heading" class="text-sm font-semibold uppercase tracking-[0.3em] text-secondary">Guest love</h2>
 
          <div id="t-text" class="mt-8 min-h-64 transition-opacity duration-300 motion-reduce:transition-none" aria-live="polite">
            <p id="t-quote" class="text-2xl font-semibold leading-snug sm:text-4xl sm:leading-snug"></p>
            <p id="t-name" class="mt-8 text-sm font-semibold uppercase tracking-[0.2em]"></p>
            <p id="t-role" class="mt-1 text-xs uppercase tracking-[0.2em] text-paper/50"></p>
          </div>
 
          <div class="mt-10 flex items-center gap-4">
            <button type="button" id="t-prev" aria-label="Previous review"
              class="flex size-12 items-center justify-center rounded-full border border-paper/30 transition-colors hover:border-secondary hover:bg-secondary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-secondary">
              <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            </button>
            <button type="button" id="t-next" aria-label="Next review"
              class="flex size-12 items-center justify-center rounded-full bg-secondary transition-colors hover:bg-paper hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-paper">
              <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
            </button>
            <p id="t-count" class="ms-2 text-xs font-semibold tracking-[0.25em] text-paper/50"></p>
          </div>
        </div>
 
        <!-- ছবির স্ট্যাক -->
        <ul id="t-stack" tabindex="0" aria-label="Guest photos, use left and right arrow keys to change"
          class="relative mx-auto aspect-square w-full max-w-sm rounded-[2rem] focus-visible:outline-2 focus-visible:outline-offset-8 focus-visible:outline-secondary sm:max-w-md">
 
          <li data-quote="The kacchi tasted exactly like the one my nana used to make. I have already booked again for next Friday." data-name="Sadia Rahman" data-role="Dhanmondi"
            class="absolute inset-0 cursor-pointer transition-all duration-500 ease-out motion-reduce:transition-none">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=800&q=80" alt="Sadia Rahman" class="size-full rounded-[2rem] object-cover shadow-2xl" />
          </li>
 
          <li data-quote="Warm service, a lovely room and the shorshe ilish was perfect. A great place for a family dinner." data-name="Tanvir Ahmed" data-role="Gulshan"
            class="absolute inset-0 cursor-pointer transition-all duration-500 ease-out motion-reduce:transition-none">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=800&q=80" alt="Tanvir Ahmed" class="size-full rounded-[2rem] object-cover shadow-2xl" />
          </li>
 
          <li data-quote="We celebrated our anniversary here. The staff surprised us with firni and a candle. Unforgettable." data-name="Nusrat Jahan" data-role="Uttara"
            class="absolute inset-0 cursor-pointer transition-all duration-500 ease-out motion-reduce:transition-none">
            <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=800&q=80" alt="Nusrat Jahan" class="size-full rounded-[2rem] object-cover shadow-2xl" />
          </li>
 
          <li data-quote="I bring every visitor from abroad here. It is the one place that tastes like home cooking." data-name="Imran Hossain" data-role="Banani"
            class="absolute inset-0 cursor-pointer transition-all duration-500 ease-out motion-reduce:transition-none">
            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=800&q=80" alt="Imran Hossain" class="size-full rounded-[2rem] object-cover shadow-2xl" />
          </li>
 
        </ul>
 
      </div>
    </div>
  </section>
 
  <script>
    (function () {
      var stack = document.getElementById('t-stack');
      var cards = Array.prototype.slice.call(stack.querySelectorAll('li'));
      var textBox = document.getElementById('t-text');
      var quote = document.getElementById('t-quote');
      var nameEl = document.getElementById('t-name');
      var role = document.getElementById('t-role');
      var count = document.getElementById('t-count');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var active = 0;
 
      // সামনের তিনটা কার্ডের অবস্থান: সোজা, ডানে হেলানো, বামে হেলানো
      var poses = [
        'translate(0,0) rotate(0deg) scale(1)',
        'translate(9%,2%) rotate(6deg) scale(0.93)',
        'translate(-9%,3%) rotate(-6deg) scale(0.86)'
      ];
 
      function setText() {
        var c = cards[active];
        quote.textContent = '\u201C' + c.dataset.quote + '\u201D';
        nameEl.textContent = c.dataset.name;
        role.textContent = c.dataset.role;
        count.textContent = (active + 1) + ' / ' + cards.length;
        textBox.style.opacity = '1';
      }
 
      function render(first) {
        cards.forEach(function (card, i) {
          var offset = (i - active + cards.length) % cards.length;
          if (offset < 3) {
            card.style.transform = poses[offset];
            card.style.zIndex = String(30 - offset * 10);
            card.style.opacity = '1';
          } else {
            card.style.transform = 'translate(0,6%) scale(0.8)';
            card.style.zIndex = '0';
            card.style.opacity = '0';
          }
          card.style.pointerEvents = offset === 0 ? 'auto' : 'none';
          card.setAttribute('aria-hidden', offset === 0 ? 'false' : 'true');
        });
 
        if (first || reduce) {
          setText();
        } else {
          textBox.style.opacity = '0';
          setTimeout(setText, 200);
        }
      }
 
      function go(n) {
        active = (n + cards.length) % cards.length;
        render(false);
      }
 
      document.getElementById('t-next').addEventListener('click', function () { go(active + 1); });
      document.getElementById('t-prev').addEventListener('click', function () { go(active - 1); });
      cards.forEach(function (c) { c.addEventListener('click', function () { go(active + 1); }); });
 
      stack.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') { e.preventDefault(); go(active + 1); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); go(active - 1); }
      });
 
      // মোবাইলে সোয়াইপ
      var startX = 0;
      stack.addEventListener('touchstart', function (e) { startX = e.changedTouches[0].clientX; }, { passive: true });
      stack.addEventListener('touchend', function (e) {
        var dx = e.changedTouches[0].clientX - startX;
        if (Math.abs(dx) > 40) { go(active + (dx < 0 ? 1 : -1)); }
      }, { passive: true });
 
      render(true);
    })();
  </script>
</body>
</html>
