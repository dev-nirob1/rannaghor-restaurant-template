  <!-- Photo viewer (Preline modal) -->
  <div id="gallery-modal" class="hs-overlay pointer-events-none fixed inset-0 z-[80] hidden size-full overflow-hidden" role="dialog" aria-modal="true" aria-label="Photo viewer" tabindex="-1">
    <div class="hs-overlay-open:opacity-100 pointer-events-auto relative flex size-full items-center justify-center bg-primary/95 px-4 py-20 opacity-0 transition-opacity duration-300 sm:px-24">

      <!-- বাইরে ক্লিকে বন্ধ -->
      <button type="button" data-hs-overlay="#gallery-modal" tabindex="-1" aria-hidden="true" class="absolute inset-0 cursor-default"></button>

      <p id="gm-count" class="absolute left-5 top-6 text-sm font-semibold text-paper/80 sm:left-8" aria-live="polite"></p>

      <button type="button" data-hs-overlay="#gallery-modal" aria-label="Close photo viewer"
        class="absolute right-4 top-4 flex size-12 items-center justify-center rounded-full bg-paper/10 text-paper transition-colors hover:bg-paper hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-paper sm:right-8">
        <span class="fa-solid fa-xmark" aria-hidden="true"></span>
      </button>

      <button type="button" id="gm-prev" aria-label="Previous photo"
        class="absolute left-3 top-1/2 flex size-12 -translate-y-1/2 items-center justify-center rounded-full border border-paper/30 text-paper transition-colors hover:bg-paper hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-paper sm:left-8 sm:size-14">
        <span class="fa-solid fa-arrow-left" aria-hidden="true"></span>
      </button>
      <button type="button" id="gm-next" aria-label="Next photo"
        class="absolute right-3 top-1/2 flex size-12 -translate-y-1/2 items-center justify-center rounded-full bg-secondary text-paper transition-colors hover:bg-paper hover:text-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-paper sm:right-8 sm:size-14">
        <span class="fa-solid fa-arrow-right" aria-hidden="true"></span>
      </button>

      <figure class="relative flex max-h-full max-w-5xl flex-col items-center">
        <img id="gm-img" src="" alt="" class="max-h-[70vh] w-auto rounded-2xl object-contain shadow-2xl" />
        <figcaption id="gm-caption" class="mt-6 max-w-xl text-center text-lg font-semibold text-paper" aria-live="polite"></figcaption>
      </figure>

    </div>
  </div>

  <!-- footer: index.html থেকে কপি করে লিংক বদলান (ওপরের ঢেউ fill-concrete) -->

  <script src="../assets/js/preline.js"></script>
  <script>
    (function () {
      var tiles = Array.prototype.slice.call(document.querySelectorAll('[data-gallery-item]'));
      var modal = document.getElementById('gallery-modal');
      var img = document.getElementById('gm-img');
      var caption = document.getElementById('gm-caption');
      var count = document.getElementById('gm-count');
      var index = 0;

      function show(n) {
        index = (n + tiles.length) % tiles.length;
        var tile = tiles[index];
        var thumb = tile.querySelector('img');
        img.src = tile.dataset.full;
        img.alt = thumb.alt;
        caption.textContent = tile.dataset.caption || thumb.alt;
        count.textContent = (index + 1) + ' / ' + tiles.length;
      }

      tiles.forEach(function (tile, n) {
        tile.addEventListener('click', function () { show(n); });
      });
      document.getElementById('gm-prev').addEventListener('click', function () { show(index - 1); });
      document.getElementById('gm-next').addEventListener('click', function () { show(index + 1); });

      document.addEventListener('keydown', function (e) {
        if (modal.classList.contains('hidden')) return;
        if (e.key === 'ArrowLeft') show(index - 1);
        if (e.key === 'ArrowRight') show(index + 1);
      });
    })();
  </script>
