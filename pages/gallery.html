    <!-- CTA strip -->
    <section class="relative bg-concrete">
      <div class="bg-paper" aria-hidden="true">
        <svg viewBox="0 0 1440 80" preserveAspectRatio="none" class="block h-10 w-full sm:h-16 lg:h-20">
          <path class="fill-concrete" d="M0,50 C200,0 420,90 720,45 C1000,5 1220,85 1440,40 L1440,80 L0,80 Z" />

      <div class="mx-auto max-w-3xl px-4 pb-24 pt-6 text-center sm:px-6">

  <!-- Lightbox modal -->
  <dialog id="lightbox" aria-label="Photo viewer" class="m-0 size-full max-h-none max-w-none bg-transparent p-0 text-paper backdrop:bg-primary/95 backdrop:backdrop-blur-sm">
    <div id="lb-wrap" class="relative flex size-full flex-col items-center justify-center px-4 py-20 sm:px-24">

      <p id="lb-count" class="absolute left-6 top-6 text-xs font-semibold uppercase tracking-[0.25em] text-paper/70" aria-live="polite"></p>

      <button type="button" id="lb-close" aria-label="Close" class="absolute right-4 top-4 flex size-12 items-center justify-center rounded-full bg-paper/10 transition-colors hover:bg-secondary hover:text-primary focus-visible:outline-2 focus-visible:outline-secondary sm:right-6 sm:top-6">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>

      <button type="button" id="lb-prev" aria-label="Previous photo" class="absolute left-3 top-1/2 flex size-12 -translate-y-1/2 items-center justify-center rounded-full bg-secondary text-primary transition-colors hover:bg-paper focus-visible:outline-2 focus-visible:outline-paper sm:left-6 sm:size-14">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
      </button>
      <button type="button" id="lb-next" aria-label="Next photo" class="absolute right-3 top-1/2 flex size-12 -translate-y-1/2 items-center justify-center rounded-full bg-secondary text-primary transition-colors hover:bg-paper focus-visible:outline-2 focus-visible:outline-paper sm:right-6 sm:size-14">
        <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
      </button>

      <figure class="flex max-h-full max-w-5xl flex-col items-center">
        <img id="lb-img" src="" alt="" class="max-h-[70vh] w-auto rounded-[2rem] rounded-tr-[5rem] object-contain opacity-0 shadow-2xl transition-opacity duration-300" />
        <figcaption id="lb-caption" class="mt-6 max-w-xl text-center font-display text-2xl italic text-paper/90"></figcaption>
      </figure>

    </div>
  </dialog>

  <!-- footer: index.html থেকে কপি করে লিংক বদলান -->

  <script src="../assets/js/preline.js"></script>
  <script>
    (function () {
      var grid = document.getElementById('gallery-grid');
      var items = Array.prototype.slice.call(grid.querySelectorAll('[data-item]'));
      var filters = document.querySelectorAll('#gallery-filters [data-filter]');
      var dlg = document.getElementById('lightbox');
      var wrap = document.getElementById('lb-wrap');
      var img = document.getElementById('lb-img');
      var cap = document.getElementById('lb-caption');
      var count = document.getElementById('lb-count');
      var visible = items.slice();
      var index = 0;
      var opener = null;

      function applyFilter(cat) {
        items.forEach(function (el) { el.hidden = !(cat === 'all' || el.dataset.cat === cat); });
        visible = items.filter(function (el) { return !el.hidden; });
        filters.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.filter === cat)); });
      }

      function preload(i) {
        var n = visible[(i + visible.length) % visible.length];
        if (n) { new Image().src = n.querySelector('button').dataset.full; }
      }

      function show(i) {
        index = (i + visible.length) % visible.length;
        var li = visible[index];
        var btn = li.querySelector('button');
        var thumb = li.querySelector('img');
        img.classList.add('opacity-0');
        img.onload = img.onerror = function () { img.classList.remove('opacity-0'); };
        img.src = btn.dataset.full;
        img.alt = thumb.alt;
        cap.textContent = li.dataset.caption || thumb.alt;
        count.textContent = (index + 1) + ' / ' + visible.length;
        preload(index + 1);
        preload(index - 1);
      }

      function openAt(li) {
        opener = li.querySelector('button');
        show(visible.indexOf(li));
        dlg.showModal();
        document.body.classList.add('overflow-hidden');
      }

      filters.forEach(function (b) {
        b.addEventListener('click', function () { applyFilter(b.dataset.filter); });
      });

      items.forEach(function (li) {
        li.querySelector('button').addEventListener('click', function () { openAt(li); });
      });

      document.getElementById('lb-prev').addEventListener('click', function () { show(index - 1); });
      document.getElementById('lb-next').addEventListener('click', function () { show(index + 1); });
      document.getElementById('lb-close').addEventListener('click', function () { dlg.close(); });

      wrap.addEventListener('click', function (e) { if (e.target === wrap) { dlg.close(); } });

      dlg.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') { show(index - 1); }
        if (e.key === 'ArrowRight') { show(index + 1); }
      });

      dlg.addEventListener('close', function () {
        document.body.classList.remove('overflow-hidden');
        if (opener) { opener.focus(); }
      });

      var startX = 0;
      dlg.addEventListener('touchstart', function (e) { startX = e.changedTouches[0].clientX; }, { passive: true });
      dlg.addEventListener('touchend', function (e) {
        var dx = e.changedTouches[0].clientX - startX;
        if (Math.abs(dx) > 50) { show(index + (dx < 0 ? 1 : -1)); }
      }, { passive: true });
    })();
  </script>
</body>
</html>
